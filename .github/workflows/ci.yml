name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: 02-project/pkgver
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-project/pkgver
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv format --check
      - run: uv check
      - run: uv audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pkgver 02-project/pkgver
      - run: docker run --rm pkgver uv ruff
